#   emoji: -1       = no emoji at all
#   emoji: 0        = get from role's icon (not tested) (fallback: no emoji)
#   emoji: "🎮"    = specifc Unicode-emoji
#   emoji: "id"     = ID of custom Discord-emoji

categories:

  - id: games
    name: Games
    multi_select: false
    embed:
      title: Choose a game
      description: You can select only one game at a time.
      image: https://example.com/image.png  # Optional
      color: 0x5865F2                        # optional, hex
    roles:
      - id: 1486405119418564790
        name: CS2           # if empty or null — pull from Discord
        emoji: "🔫"
      - id: 1486405460801229011
        name: null
        emoji: "-1"

  - id: colors
    name: Nickname Color
    multi_select: true
    embed:
      title: Choose a color
      description: You can select multiple colors simultaneously.
      color: 0xEB459E
    roles:
      - id: 1486410021091672074
        name: Red
        emoji: "❤️"
      - id: 1486410076339310662
        name: Blue
        emoji: "💙"
      - id: 1486409575421968484
        name: Yellow
        emoji: "1486409854288527410" # custom emoji by ID