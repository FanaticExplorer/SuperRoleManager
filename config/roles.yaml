# Just an example

categories:

  - id: games
    name: Games
    multi_select: false
    embed:
      title: Choose a game
      description: You can only select one game at a time.
      image: https://example.com/games.png  # optional
      color: "#5865F2"                       # optional, hex
    roles:
      - id: 123456789
        name: CS2           # if empty or null — fetch from Discord
        emoji: "🔫"
      - id: 987654321
        name: null          # fetch name from Discord by role id
        emoji: "0"          # try to fetch from role icon

  - id: colors
    name: Nickname color
    multi_select: true
    embed:
      title: Choose a color
      description: You can select multiple colors at once.
      color: "#EB459E"
    roles:
      - id: 111111111
        name: Red
        emoji: "❤️"
      - id: 222222222
        name: Blue
        emoji: "💙"
      - id: 333333333
        name: No color
        emoji: "-1"         # explicitly no emoji
