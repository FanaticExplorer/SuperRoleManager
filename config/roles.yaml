# Легенда для поля emoji:
#   emoji: -1       = без эмодзи (явно)
#   emoji: 0        = подтянуть из иконки роли (fallback: без эмодзи)
#   emoji: "🎮"    = конкретный Unicode-эмодзи
#   emoji: "id"     = ID кастомного Discord-эмодзи

categories:

  - id: games
    name: Игры
    multi_select: false
    embed:
      title: Выбери игру
      description: Можно выбрать только одну игру за раз.
      image: https://i.pinimg.com/736x/45/66/4d/45664deff823f82bb76b8c4d0c80c4d1.jpg  # опционально
      color: 0x5865F2                        # опционально, hex
    roles:
      - id: 1486405119418564790
        name: CS2           # если пусто или null — подтянуть с Discord
        emoji: "🔫"
      - id: 1486405460801229011
        name: null          # подтянуть название из Discord по role id
        emoji: "-1"            # попробовать подтянуть из иконки роли

  - id: colors
    name: Цвет ника
    multi_select: true
    embed:
      title: Выбери цвет
      description: Можно выбрать несколько цветов одновременно.
      color: 0xEB459E
    roles:
      - id: 1486410021091672074
        name: Красный
        emoji: "❤️"
      - id: 1486410076339310662
        name: Синий
        emoji: "💙"
      - id: 1486409575421968484
        name: Желтый
        emoji: "1486409854288527410"